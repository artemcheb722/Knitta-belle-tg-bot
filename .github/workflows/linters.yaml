name: lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: uv sync --dev

      - name: run isort
        run: uv run isort --check-only --diff .

      - name: run black
        run: uv run black --check --diff .

      - name: run flake8
        run: uv run flake8 .